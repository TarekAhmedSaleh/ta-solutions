    <script>
      // Clear any service workers left over from previous Blazor PWA deployment
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          if (registrations.length > 0) {
            for (let registration of registrations) {
              registration.unregister();
            }
            window.location.reload();
          }
        });
      }
    </script>

    <!-- Resolve the theme before paint, to avoid a flash. An explicit choice
         (only written when the visitor uses the toggle) always wins; otherwise
         follow the browser's prefers-color-scheme, which itself follows the OS
         unless overridden. Falls back to light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ta-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
